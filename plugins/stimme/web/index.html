<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Claude spricht</title>
<style>
:root{--bg:#0b1220;--panel:#111a2c;--line:#22304a;--text:#f3f5f9;--dim:#5b6782;--now:#ffd23f;--claude:#d97757;--pruefer:#6ea8fe}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:36px 44px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 32px 32px;min-height:200px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:18px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.who{font-weight:700;color:var(--claude)}.who.pruefer{color:var(--pruefer)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim)}.dot.live{background:var(--claude)}.dot.live.pruefer{background:var(--pruefer)}
.words{font-size:46px;line-height:1.3;font-weight:650}.spoken{color:var(--text)}.now{color:var(--now)}.rest{color:var(--dim)}.idle{font-size:22px;color:var(--dim)}
</style></head><body>
<div class="card"><div class="head"><span class="dot" id="dot"></span><span class="who" id="who">Claude Code</span><span id="status">wartet</span></div>
<div class="words" id="words"><span class="idle">Noch nichts gesagt.</span></div></div>
<script>
const $=id=>document.getElementById(id),LABEL={claude:"Claude Code",pruefer:"Prüferin"};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(s){
  const p=(s.parts||[])[s.idx]; if(!p) return;
  const live=!s.done;
  $("who").textContent=LABEL[p.speaker]||"Claude Code"; $("who").className="who "+p.speaker;
  $("dot").className="dot"+(live?" live "+p.speaker:""); $("status").textContent=live?"spricht":"fertig";
  const t=p.text,a=s.pos;
  $("words").innerHTML = a<0 ? (s.done?'<span class="spoken">'+esc(t)+'</span>':'<span class="rest">'+esc(t)+'</span>')
    : '<span class="spoken">'+esc(t.slice(0,a))+'</span><span class="now">'+esc(t.slice(a,a+s.len))+'</span><span class="rest">'+esc(t.slice(a+s.len))+'</span>';
}
setInterval(async()=>{try{const r=await fetch("state.json?t="+Date.now(),{cache:"no-store"});if(r.ok)render(await r.json())}catch(e){}},100);
</script></body></html>
